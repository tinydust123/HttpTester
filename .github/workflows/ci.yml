name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 9.0.x
      - name: 还原与构建
        run: |
          dotnet restore HttpTester.sln --artifacts-path artifacts/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build HttpTester.sln -c Release --no-restore --artifacts-path artifacts/build
      - name: 核心与界面检查
        run: ./scripts/test.ps1
      - name: 打包轻量版
        run: ./scripts/publish.ps1 -Package
      - name: 打包独立版
        run: ./scripts/publish.ps1 -Standalone -Package
      - name: 上传分发包与校验文件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HttpDetector-win-x64
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.sha256
          if-no-files-found: error
          retention-days: 14
